`n\\\" | Out-File -Encoding UTF8 'index_html.txt'\nWrite-Host 'Done, lines:' \\$lines.Count\n\")", "Bash(cd \"C:\\Users\\86156\\Desktop\\CF-GitHub-Proxy\" && python -c \"\nimport re\nwith open('index.html', 'r', encoding='utf-8') as f:\n    html = f.read()\n# Minify: remove leading whitespace, collapse blank lines\nlines = html.split('\\n')\nminified = []\nfor line in lines:\n    stripped = line.strip()\n    if stripped:\n        minified.append(stripped)\nresult = ' '.join(minified)\n# Escape for JS template literal\nresult = result.replace('\\\\\\\\', '\\\\\\\\\\\\\\\\').replace('\\`', '\\\\\\\\\\`').replace('\\$', '\\\\\\\\\\$')\n# Write as JS const\nwith open('index_html.js', 'w', encoding='utf-8') as f:\n    f.write('const INDEX_HTML = \\`' + result + '\\`;')\nprint('Done, size:', len(result), 'chars')\n\")", "Bash(cd \"C:\\Users\\86156\\Desktop\\CF-GitHub-Proxy\" && node -e \"\nconst fs = require('fs');\nlet html = fs.readFileSync('index.html', 'utf8');\n// Collapse whitespace  \nhtml = html.replace(/\\n\\s*/g, ' ').replace(/\\s+/g, ' ').trim();\n// Escape for JS template literal\nhtml = html.replace(/\\\\\\\\/g, '\\\\\\\\\\\\\\\\').replace(/\\`/g, '\\\\\\\\\\`').replace(/\\\\\\$/g, '\\\\\\\\\\$');\nconst output = 'const INDEX_HTML = \\`' + html + '\\`;\\\\n';\nfs.writeFileSync('index_html.js', output, 'utf8');\nconsole.log('Lines: 1, Chars:', html.length);\n\")", "Bash(cd \"C:\\Users\\86156\\Desktop\\CF-GitHub-Proxy\" && node _encode.js)", "Bash(cd \"C:\\Users\\86156\\Desktop\\CF-GitHub-Proxy\" && wc -c index_html.js)", "Bash(cd \"C:\\Users\\86156\\Desktop\\CF-GitHub-Proxy\" && node _merge.js)", "Bash(cd \"C:\\Users\\86156\\Desktop\\CF-GitHub-Proxy\" && del _encode.js _merge.js index_html.js 2>nul & echo \"cleaned\")", "Bash(cd \"C:\\Users\\86156\\Desktop\\CF-GitHub-Proxy\" && git status && echo \"---\" && git remote -v)", "Bash(cd \"C:\\Users\\86156\\Desktop\\CF-GitHub-Proxy\" && del _encode.js _merge.js index_html.js nul 2>nul & echo done)", "Bash(cd \"C:\\